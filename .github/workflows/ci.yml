name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Format
        run: uv run ruff format --check
      - name: Test (fast; slow tests need the real model)
        run: uv run pytest

  # Build after `check` passes. Pull requests build and discard the image, so a
  # broken Dockerfile is caught before merge; only main pushes to GHCR.
  docker:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # The model stage downloads the 2.2 GB fp32 ONNX export and writes the
      # int8 result, on top of the build cache and the image loaded for the
      # smoke test; the runner's ~14 GB free is tight. These preinstalled
      # toolchains are unused here and free ~30 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
      # Build once into the local daemon and smoke-test the real container
      # (read-only root fs, as in Kubernetes) before anything is pushed.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: embed-api:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # mode=min: only the final image's layers are cached, not the model
          # stage's 2.2 GB fp32 download, which would crowd the 10 GB cache.
          cache-to: type=gha,mode=min
      - name: Smoke test
        run: scripts/smoke_test.sh embed-api:ci
      # Push the image that passed the smoke test, not a rebuild of it.
      - name: Push
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag embed-api:ci "$tag"
            docker push "$tag"
          done
