[project]
name = "embed-api"
version = "0.1.0"
description = "Production-minded HTTP API for the multilingual-e5-large embedding model"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "sentence-transformers>=3.3",
    # Listed directly so the CPU-only index below applies to it; otherwise
    # sentence-transformers pulls the CUDA build transitively (~5 GB extra).
    "torch>=2.5",
    "huggingface-hub>=0.26",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embed_api"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the real model (deselect with -m 'not slow')"]
addopts = "-m 'not slow'"
